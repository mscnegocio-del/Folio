/* ============================================================
   Folio · estilos v0.3 — mismo sistema visual que el sitio web.
   Tema claro y oscuro con los mismos componentes; ver process/specs/rediseno-visual-v0.3.md
   ============================================================ */
:root{
  --paper:#F5F5F4; --sheet:#FFFFFF; --sheet-2:#F4F4F5;
  --ink:#111114; --graphite:#52525B; --faint:#71717A;
  --rule:#E7E7EA; --rule-strong:#D4D4D8;
  --stamp:#3D5AF1; --stamp-ink:#2F49D6; --stamp-soft:#ECEFFE; --on-stamp:#FFFFFF;
  --danger:#C0362C; --danger-soft:#FDECEA;
  --ok:#1F7A4D; --ok-soft:#E6F4EC;
  --warn:#8A5A00; --warn-soft:#FBF1DC;
  --btn-bg:#111114; --btn-fg:#FFFFFF;
  --btn2-bg:rgba(17,17,20,.03); --btn2-bd:rgba(17,17,20,.14);
  --hover:rgba(17,17,20,.045); --selected:rgba(17,17,20,.075);
  --bubble:#EFEFF1;
  --glow:rgba(77,107,254,.10);
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:Montserrat,"DM Sans",system-ui,sans-serif;
  --type:"Fragment Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r-control:10px; --r-sheet:16px; --r-pill:100px;
  --shadow-sheet:0 1px 2px rgba(17,17,20,.04),0 10px 28px -18px rgba(17,17,20,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A0A0A; --sheet:#121214; --sheet-2:#1A1A1D;
    --ink:#F4F4F5; --graphite:#A1A1AA; --faint:#7E7E87;
    --rule:#232326; --rule-strong:#36363C;
    --stamp:#8B9DFF; --stamp-ink:#A9B6FF; --stamp-soft:#171C36; --on-stamp:#0A0A0A;
    --danger:#FF8A80; --danger-soft:#2D1614;
    --ok:#7FD1A3; --ok-soft:#10241A;
    --warn:#F2C35B; --warn-soft:#2A2210;
    --btn-bg:#FFFFFF; --btn-fg:#0A0A0A;
    --btn2-bg:rgba(255,255,255,.06); --btn2-bd:rgba(255,255,255,.15);
    --hover:rgba(255,255,255,.05); --selected:rgba(255,255,255,.085);
    --bubble:#26272B;
    --glow:rgba(64,104,160,.42);
    --shadow-sheet:0 0 0 1px rgba(0,0,0,.25),0 18px 44px -26px rgba(0,0,0,.95);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A0A0A; --sheet:#121214; --sheet-2:#1A1A1D;
  --ink:#F4F4F5; --graphite:#A1A1AA; --faint:#7E7E87;
  --rule:#232326; --rule-strong:#36363C;
  --stamp:#8B9DFF; --stamp-ink:#A9B6FF; --stamp-soft:#171C36; --on-stamp:#0A0A0A;
  --danger:#FF8A80; --danger-soft:#2D1614;
  --ok:#7FD1A3; --ok-soft:#10241A;
  --warn:#F2C35B; --warn-soft:#2A2210;
  --btn-bg:#FFFFFF; --btn-fg:#0A0A0A;
  --btn2-bg:rgba(255,255,255,.06); --btn2-bd:rgba(255,255,255,.15);
  --hover:rgba(255,255,255,.05); --selected:rgba(255,255,255,.085);
  --bubble:#26272B;
  --glow:rgba(64,104,160,.42);
  --shadow-sheet:0 0 0 1px rgba(0,0,0,.25),0 18px 44px -26px rgba(0,0,0,.95);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis-weight:none}
h1,h2,h3,h4{line-height:1.25;margin:0;font-weight:500;letter-spacing:-.01em}
h1{font-family:var(--display);font-weight:400;letter-spacing:-.02em}
p{margin:0 0 .8em}
strong,b{font-weight:700}
a{color:var(--stamp-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
::selection{background:var(--stamp-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--type)}
.muted{color:var(--graphite)}
.small{font-size:.875rem}
.tiny{font-size:.8125rem}

/* Controles: botones en píldora como en el sitio */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--btn2-bd);background:var(--btn2-bg);color:var(--ink);padding:.6em 1.2em;border-radius:var(--r-pill);cursor:pointer;font-weight:500;font-size:.9375rem;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--selected)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.primary:hover{background:var(--btn-bg);opacity:.86}
.btn.ghost{background:transparent;border-color:transparent;color:var(--graphite)}
.btn.ghost:hover{color:var(--ink);background:var(--hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:.42em .9em;font-size:.8125rem}
.btn.block{width:100%}
.field{display:grid;gap:.35em;margin-bottom:1em}
.field>span{font-size:.875rem;font-weight:500}
.field small{color:var(--graphite);font-size:.8125rem}
.input,.select,.textarea{width:100%;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--r-control);padding:.65em .85em;line-height:1.4;transition:border-color .15s,box-shadow .15s}
.textarea{resize:vertical;min-height:5.5em}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--stamp);box-shadow:0 0 0 3px var(--stamp-soft)}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input.mono{letter-spacing:.01em}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1em}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.check{display:grid;grid-template-columns:auto 1fr;gap:.75em;align-items:start;padding:.9em 1.05em;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);margin-bottom:.6em;cursor:pointer;transition:border-color .15s,background .15s}
.check:hover{border-color:var(--rule-strong)}
.check input{width:1.15em;height:1.15em;margin-top:.2em;accent-color:var(--stamp)}
.check:has(input:checked){border-color:var(--stamp);background:var(--stamp-soft)}
.switch{display:flex;align-items:flex-start;gap:.75em;cursor:pointer}
.switch input{appearance:none;flex:none;width:2.4em;height:1.4em;border-radius:1em;background:var(--rule-strong);position:relative;cursor:pointer;margin-top:.1em;transition:background .15s}
.switch input::after{content:"";position:absolute;top:.2em;left:.2em;width:1em;height:1em;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--stamp)}
.switch input:checked::after{transform:translateX(1em)}
.note{border:1px solid var(--rule);background:var(--sheet-2);padding:.8em 1.05em;border-radius:12px;font-size:.9375rem}
.note.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.note.danger{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.note.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.note p:last-child{margin:0}
.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.75rem;font-weight:500;padding:.12em .65em;border-radius:var(--r-pill);border:1px solid var(--rule-strong);color:var(--graphite);white-space:nowrap}
.chip.due{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--danger);background:var(--danger-soft)}
.chip.soon{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn);background:var(--warn-soft)}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);background:var(--ok-soft)}

/* Sello: el elemento propio de Folio */
.stamp{display:inline-grid;gap:.15em;font-family:var(--type);color:var(--stamp);border:1.5px solid currentColor;outline:1px solid currentColor;outline-offset:3px;border-radius:10px;padding:.45em .9em;transform:rotate(-2.5deg);line-height:1.2;text-align:center;background:transparent;user-select:none}
.stamp b{font-size:.78rem;font-weight:400;text-transform:uppercase;letter-spacing:.08em}
.stamp span{font-size:.7rem;opacity:.85}
.stamp.big{font-size:1.2rem;padding:.65em 1.3em}
.stamp.big b{font-size:1.05rem}
.stamp.big span{font-size:.85rem}
.stamp.press{animation:press .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes press{0%{transform:rotate(-9deg) scale(1.6);opacity:0}60%{transform:rotate(-2deg) scale(.96);opacity:1}100%{transform:rotate(-2.5deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp.press{animation:none}}

/* Logo: ícono de documento + "folio" + insignia, igual que el sitio */
.brand{font:500 1.25rem/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:.4em;color:var(--ink)}
.brand svg{width:1.1em;height:1.1em;flex:none}
.brand .badge{font:400 .5em/1 var(--type);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:.3em .45em;border-radius:3px;margin-left:.1em}

/* Pantallas de entrada con el brillo del sitio */
.screen-center{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:radial-gradient(1100px 560px at 50% -140px,var(--glow),transparent 72%),var(--paper)}
.lock{width:min(420px,100%);text-align:center}
.lock .stamp{margin-bottom:2rem}
.lock h1{font-size:2rem;margin-bottom:.4em}
.lock form{margin-top:1.5rem;text-align:left}

/* Re-aceptación de avisos */
.reconsent{width:min(620px,100%)}
.reconsent h1{font-size:clamp(1.7rem,3vw,2.2rem);margin-bottom:.5em}
.reconsent .lead{font-size:1.0625rem;margin-bottom:1.4em}
.changes{margin:.4rem 0 0;padding-left:1.2em;color:var(--graphite)}
.changes li{margin-bottom:.4em}

/* Bienvenida */
.onb{min-height:100vh;display:grid;grid-template-columns:300px 1fr}
.onb aside{background:var(--sheet);border-right:1px solid var(--rule);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:2rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.25rem;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.1rem 1fr;align-items:center;padding:.5rem .25rem;color:var(--faint);font-weight:500;font-size:.9375rem}
.steps li::before{content:counter(s);font-family:var(--type);width:1.65rem;height:1.65rem;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:50%;font-size:.8rem}
.steps li.done{color:var(--graphite)}
.steps li.done::before{content:"✓";background:var(--stamp-soft);color:var(--stamp);border-color:var(--stamp)}
.steps li.now{color:var(--ink)}
.steps li.now::before{border-color:var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg)}
.onb main{padding:3.5rem clamp(1.25rem,5vw,4rem) 2rem;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 40% -120px,var(--glow),transparent 72%),var(--paper)}
.onb .content{max-width:640px;width:100%}
.onb h1{font-size:clamp(1.85rem,3.4vw,2.5rem);margin-bottom:.55em}
.onb .lead{font-size:1.125rem;color:var(--graphite);margin-bottom:1.6em;max-width:60ch}
.onb .nav{margin-top:auto;padding-top:2rem;display:flex;justify-content:space-between;gap:1rem;max-width:640px}
.onb .legal-links{font-size:.875rem;color:var(--graphite);display:grid;gap:.35rem}
@media (max-width:820px){.onb{grid-template-columns:1fr}.onb aside{border-right:0;border-bottom:1px solid var(--rule);padding:1rem 1.25rem;gap:1rem}.steps{grid-auto-flow:column;overflow-x:auto}.steps li{grid-template-columns:1.95rem auto;font-size:.8125rem;white-space:nowrap;padding-right:.6rem}.onb main{padding-top:1.75rem}.onb .legal-links{display:none}}

/* Diagrama de flujo (paso 1 de la bienvenida) */
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:stretch;margin:1.5rem 0}
.flow .node{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);padding:1.1rem 1.2rem;box-shadow:var(--shadow-sheet)}
.flow .node h3{font-size:1rem;margin-bottom:.4em}
.flow .node ul{margin:0;padding-left:1.1em;color:var(--graphite);font-size:.9rem}
.flow .node.you{border:1.5px solid var(--stamp)}
.flow .arrow{display:grid;place-items:center;align-content:center;gap:.5rem;text-align:center;font-size:.8rem;color:var(--graphite);max-width:150px}
.flow .arrow svg{width:64px;height:20px;color:var(--stamp)}
.flow .none{grid-column:1/-1;border:1.5px dashed var(--rule-strong);border-radius:var(--r-sheet);padding:.85rem 1.05rem;color:var(--graphite);font-size:.9375rem;display:flex;gap:.75rem;align-items:center}
.flow .none s{font-weight:700;color:var(--ink)}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow .arrow svg{transform:rotate(90deg)}}

/* Estructura de la app */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
.side{background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.side-top{padding:1rem 1rem .85rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.side .search{margin:0 1rem .75rem}
.side-section{padding:.25rem 1rem .5rem}
.side-section h2{font-size:.75rem;color:var(--faint);font-weight:500;margin:.5rem 0;text-transform:uppercase;letter-spacing:.06em}
.deadlines{list-style:none;margin:0;padding:0;display:grid;gap:.2rem}
.deadlines li button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start;width:100%;box-sizing:border-box;font-size:.8125rem;padding:.4rem .45rem;border-radius:8px}
.deadlines li button:hover{background:var(--hover)}
.deadlines li button:focus-visible{outline:2px solid var(--stamp)}
.deadlines .d{font-family:var(--type);min-width:3.4em}
.deadlines .muted.mono{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.explist{list-style:none;margin:0;padding:.5rem;overflow:auto;flex:1;min-height:0;border-top:1px solid var(--rule)}
.explist li+li{margin-top:2px}
.explist li button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:.65rem .75rem;border-radius:10px;position:relative}
.explist li button:hover{background:var(--hover)}
.explist li button:focus-visible{outline:2px solid var(--stamp);outline-offset:-2px}
.explist li button[aria-current="true"]{background:var(--selected)}
.explist .num{font-family:var(--type);font-size:.78rem;color:var(--graphite);display:block;letter-spacing:.01em}
.explist li button[aria-current="true"] .num{color:var(--stamp-ink)}
.explist .tit{display:block;font-size:.9375rem;font-weight:500;margin:.1rem 0}
.explist .meta{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;color:var(--graphite);font-size:.8125rem}
.side-bottom{padding:.75rem 1rem;border-top:1px solid var(--rule);display:flex;gap:.5rem;justify-content:space-between}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.main:has(.empty){background:radial-gradient(1000px 520px at 50% -160px,var(--glow),transparent 72%),var(--paper)}
.topbar{display:none}
.caratula{background:var(--sheet);border-bottom:1px solid var(--rule);padding:1.15rem 1.5rem 0;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.caratula .expnum{font-family:var(--type);font-size:clamp(1.1rem,1.9vw,1.4rem);letter-spacing:.01em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.caratula .expnum button{font-family:var(--ui)}
.caratula .partes{margin:.4rem 0 .2rem;font-size:1.05rem;font-weight:500}
.caratula .partes .vs{color:var(--graphite);font-weight:400;margin:0 .4em}
.caratula .org{color:var(--graphite);font-size:.9rem}
.caratula .stamp-slot{padding-top:.2rem;max-width:360px}
.tabs{grid-column:1/-1;display:flex;gap:.3rem;margin:.95rem 0 .85rem;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:.42rem .95rem;font-weight:500;font-size:.9rem;color:var(--graphite);border-radius:var(--r-pill);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button:focus-visible{outline:2px solid var(--stamp);outline-offset:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--selected)}
.tabs .agent-tab{display:none}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,42%);grid-template-rows:minmax(0,1fr)}
.pane,.main,.work>*{min-width:0}
.pane{overflow:auto;padding:1.5rem;min-height:0}
.agent{border-left:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr)}
  .agent{display:none;border-left:0}
  .tabs .agent-tab{display:block}
  .work.show-agent .pane{display:none}
  .work.show-agent .agent{display:flex}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-sheet)}
  .app.side-open .side{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:var(--sheet);border-bottom:1px solid var(--rule)}
  .caratula{grid-template-columns:1fr;padding:1rem 1rem 0}
  .caratula .expnum{font-size:1.05rem}
  .caratula .stamp-slot{display:none}
  .pane{padding:1rem}
  .sheet{padding:1rem}
}
.scrim{display:none}
@media (max-width:820px){.app.side-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:39}}

/* Hojas dentro de los paneles: tarjetas como en el sitio */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);padding:1.2rem 1.35rem;margin-bottom:1.1rem}
.sheet h3{font-size:1.05rem;margin-bottom:.2em}
.sheet .hint{color:var(--graphite);font-size:.875rem;margin-bottom:.8em}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.6rem;flex-wrap:wrap}
.memgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 1.1rem}
.memgrid>*{min-width:0}
.memgrid .span{grid-column:1/-1}
@media (max-width:980px){.memgrid{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:start;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.list input[type=checkbox]{width:1.05em;height:1.05em;margin-top:.25em;accent-color:var(--stamp)}
.list .done{text-decoration:line-through;color:var(--faint)}
.list .date{font-family:var(--type);font-size:.85rem}
.iconbtn{all:unset;cursor:pointer;color:var(--faint);padding:.2rem .4rem;border-radius:6px;font-size:.875rem;line-height:1}
.iconbtn:hover{color:var(--danger);background:var(--danger-soft)}
.iconbtn:focus-visible{outline:2px solid var(--stamp)}
.addrow{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.addrow .input{flex:1 1 9em;min-width:0}
.addrow input[type=date]{flex:0 0 10.5em}
.partes-table{width:100%;border-collapse:collapse;font-size:.9375rem}
.partes-table th{text-align:left;font-size:.75rem;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:.35rem .4rem;border-bottom:1px solid var(--rule)}
.partes-table td{padding:.5rem .4rem;border-bottom:1px solid var(--rule);vertical-align:top}
.partes-table .tok{font-family:var(--type);font-size:.78rem;color:var(--stamp-ink);background:var(--stamp-soft);padding:.1em .45em;border-radius:6px}
.table-wrap{overflow-x:auto}

/* Línea de tiempo */
.timeline{list-style:none;margin:0;padding:0 0 0 1.1rem;border-left:1px solid var(--rule-strong)}
.timeline li{position:relative;padding:.1rem 0 1.15rem 1rem}
.timeline li::before{content:"";position:absolute;left:calc(-1.1rem - 5px);top:.5rem;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--stamp)}
.timeline .when{font-family:var(--type);font-size:.8125rem;color:var(--graphite)}
.timeline .acto{font-weight:500}
.timeline .sum{color:var(--graphite);font-size:.9375rem}

/* Documentos con foliador */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.doc{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:2rem 1.05rem 1rem;min-height:140px;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;gap:.4rem}
.doc::after{content:"";position:absolute;left:12px;right:12px;bottom:-6px;height:6px;border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px;background:var(--sheet-2);z-index:-1}
.folio{position:absolute;top:.6rem;right:.7rem;font-family:var(--type);color:var(--stamp);font-size:.85rem;transform:rotate(3deg);border:1.5px solid currentColor;padding:0 .4em;border-radius:5px;opacity:.95}
.doc .name{font-weight:500;word-break:break-word}
.doc .actions{margin-top:auto;display:flex;gap:.35rem}
.dropzone{border:1.5px dashed var(--rule-strong);border-radius:var(--r-sheet);padding:1.6rem;text-align:center;color:var(--graphite);margin-bottom:1rem;cursor:pointer;background:var(--sheet);transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--graphite)}
.dropzone.over{border-color:var(--stamp);background:var(--stamp-soft)}

/* Agente: chat como la ventana del sitio */
.agent-head{padding:.9rem 1.1rem;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.agent-head>div:first-child{min-width:0}
.agent-head h2{font-size:1rem}
.agent-head .prov{font-size:.8125rem;color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-head .row{flex-wrap:nowrap}
.msgs{flex:1;overflow:auto;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:1.1rem;min-height:0}
.msg{max-width:100%}
.msg.user{align-self:flex-end;background:var(--bubble);padding:.6rem 1rem;border-radius:18px;max-width:86%;white-space:pre-wrap}
.msg.assistant{font-size:.96875rem;line-height:1.65}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{font-family:var(--ui);font-size:1rem;font-weight:700;letter-spacing:0;margin:.9em 0 .35em}
.msg.assistant ul,.msg.assistant ol{padding-left:1.25em;margin:.3em 0 .7em}
.msg.assistant li{margin-bottom:.2em}
.msg.assistant code{font-family:var(--type);font-size:.85em;background:var(--sheet-2);border:1px solid var(--rule);padding:0 .3em;border-radius:5px}
.msg .foot{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.45rem;font-size:.75rem;color:var(--faint)}
.msg.error{border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);padding:.6rem .9rem;background:var(--danger-soft);font-size:.9rem;border-radius:12px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--graphite);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.quick{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1.1rem .65rem}
.quick button{all:unset;cursor:pointer;font-size:.8125rem;border:1px solid var(--btn2-bd);background:var(--btn2-bg);padding:.32em .85em;border-radius:var(--r-pill);color:var(--graphite);transition:color .15s,background .15s}
.quick button:hover{color:var(--ink);background:var(--selected)}
.quick button:focus-visible{outline:2px solid var(--stamp)}
.composer{border-top:1px solid var(--rule);padding:.8rem 1.1rem 1rem}
.composer .textarea{min-height:3.2em;max-height:12em;border-radius:14px;background:var(--paper)}
.composer .row{justify-content:space-between;margin-top:.55rem}
.privacy-line{font-size:.75rem;color:var(--graphite);display:flex;gap:.4rem;align-items:center}
.privacy-line .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.privacy-line .dot.off{background:var(--warn)}
.empty-agent{margin:auto;text-align:center;color:var(--graphite);max-width:32ch;font-size:.9375rem}

/* Estado vacío */
.empty{margin:auto;max-width:560px;padding:3rem 1.5rem}
.empty h1{font-size:clamp(1.75rem,3.2vw,2.3rem);margin-bottom:.5em}
.empty .lead{color:var(--graphite);font-size:1.0625rem}
.empty .row{margin-top:1.4rem}

/* Ajustes */
.settings{overflow:auto;padding:1.5rem;flex:1}
.settings .wrap{max-width:760px}
.settings h1{font-size:1.85rem;margin-bottom:1rem}
.audit{width:100%;border-collapse:collapse;font-size:.8125rem}
.audit th,.audit td{text-align:left;padding:.4rem .45rem;border-bottom:1px solid var(--rule)}
.audit th{color:var(--faint);font-weight:500}
.audit td.mono{white-space:nowrap}

/* Diálogos */
dialog{border:1px solid var(--rule);padding:0;border-radius:var(--r-sheet);background:var(--sheet);color:var(--ink);width:min(680px,94vw);max-height:88vh;box-shadow:0 30px 80px -24px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,12,.5);backdrop-filter:blur(3px)}
dialog .dlg{display:flex;flex-direction:column;max-height:88vh}
dialog .dlg-head{padding:1rem 1.35rem;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:1rem}
dialog .dlg-head h2{font-size:1.15rem}
dialog .dlg-body{padding:1.15rem 1.35rem;overflow:auto}
dialog .dlg-foot{padding:.9rem 1.35rem;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
dialog.wide{width:min(900px,96vw)}
.legal{font-size:.9375rem;line-height:1.65}
.legal h3{font-size:1rem;margin:1.2em 0 .4em}
.legal ol,.legal ul{padding-left:1.25em}
.draft-banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);padding:.65rem .95rem;border-radius:12px;font-size:.875rem;margin-bottom:1rem}
.payload{font-family:var(--type);font-size:.8125rem;background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r-control);padding:.85rem;white-space:pre-wrap;word-break:break-word;max-height:48vh;overflow:auto}
.payload mark{background:var(--stamp-soft);color:var(--stamp-ink);padding:0 .2em;border-radius:3px}
.payload-label{font-size:.8125rem;font-weight:500;margin:.8rem 0 .3rem}
.proposal{list-style:none;padding:0;margin:0}
.proposal li{margin-bottom:.5rem}
details.instr{margin-top:.8rem;border:1px solid var(--rule);border-radius:12px;padding:.55rem .9rem}
details.instr summary{cursor:pointer;font-weight:500;font-size:.875rem}
details.instr .payload{margin-top:.6rem;max-height:30vh}

/* Avisos flotantes */
.toasts{position:fixed;left:50%;top:calc(1rem + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:.5rem;justify-items:center;z-index:100}
.toast{background:var(--btn-bg);color:var(--btn-fg);padding:.65rem 1.15rem;border-radius:14px;font-size:.9rem;box-shadow:var(--shadow-sheet);max-width:min(420px,90vw)}
.toast.err{background:var(--danger);color:#fff}

/* Ajustes puntuales */
.onb h1:focus{outline:none}
.stamp span{max-width:38ch;white-space:normal}

/* Guía de keys y modelos sugeridos */
.linklike{all:unset;cursor:pointer;color:var(--stamp-ink);font-size:.8125rem;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.linklike:focus-visible{outline:2px solid var(--stamp)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin:.2rem 0 .55rem}
.preset{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--rule-strong);border-radius:12px;padding:.5rem .7rem;display:grid;gap:.1rem;background:var(--sheet);transition:border-color .15s,background .15s}
.preset strong{font-size:.875rem;font-weight:500}
.preset span{font-size:.75rem;color:var(--graphite)}
.preset:hover{border-color:var(--graphite)}
.preset:focus-visible{outline:2px solid var(--stamp)}
.preset.on{border-color:var(--stamp);background:var(--stamp-soft)}
details.guide{border:1px solid var(--rule);border-radius:12px;padding:.65rem .95rem;margin-bottom:.6rem;background:var(--sheet)}
details.guide summary{cursor:pointer;font-weight:500;display:flex;gap:.5rem;align-items:center}
details.guide[open]{border-color:var(--stamp)}
details.guide ol{padding-left:1.25em;margin:.6rem 0}
details.guide li{margin-bottom:.35rem}
details.guide code{font-family:var(--type);font-size:.85em;background:var(--sheet-2);padding:0 .3em;border-radius:5px}

</style>
</head>

<input type="file" id="file-backup" hidden accept=".folio,.json">
<noscript><p style="padding:2rem">Folio necesita JavaScript activado para funcionar.</p></noscript>
<script>
'use strict';
/* ============================================================

/* ---------- Markdown mínimo y seguro ---------- */
function md(src) {
  const lines = esc(src).split('\n'); let html = '', ul = false, ol = false;
  const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>');
  const close = () => { if (ul) { html += '</ul>'; ul = false; } if (ol) { html += '</ol>'; ol = false; } };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^#{1,6}\s+(.*)$/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { if (ol) { html += '</ol>'; ol = false; } if (!ul) { html += '<ul>'; ul = true; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (ul) { html += '</ul>'; ul = false; } if (!ol) { html += '<ol>'; ol = true; } html += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close(); return html;
}

const LIBS = {
  pdf: ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'],
  pdfw: ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
  mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js']
};
const loaded = {};
function loadScript(urls) {
  const key = urls[0]; if (loaded[key]) return loaded[key];
  loaded[key] = (async () => {
    for (const u of urls) {
      const ok = await new Promise(res => { const s = document.createElement('script'); s.src = u; s.async = true; s.referrerPolicy = 'no-referrer'; s.onload = () => res(true); s.onerror = () => { s.remove(); res(false); }; document.head.appendChild(s); });
      if (ok) return true;
    }
    delete loaded[key];
    throw new FolioError('No se pudo descargar el lector de documentos. Revisa tu conexión a internet o pega el texto manualmente.');
  })();
  return loaded[key];
}
async function extractText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.txt') || name.endsWith('.md')) { const text = await file.text(); return { text, pages: Math.max(1, Math.ceil(text.length / 3000)), type: 'txt', exact: false }; }
  if (name.endsWith('.pdf')) {
    await loadScript(LIBS.pdfw); await loadScript(LIBS.pdf);
    const lib = window.pdfjsLib; if (!lib) throw new FolioError('El lector de PDF no se cargó correctamente.');
    lib.GlobalWorkerOptions.workerSrc = LIBS.pdfw[0];
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
      pages.push(`[Pág. ${i}]\n` + tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').trim());
    }
    const text = pages.join('\n\n');
    return { text, pages: pdf.numPages, type: 'pdf', exact: true, scanned: text.replace(/\[Pág\. \d+\]/g, '').trim().length < pdf.numPages * 40 };
  }
  if (name.endsWith('.docx')) {
    await loadScript(LIBS.mammoth);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value, pages: Math.max(1, Math.ceil(r.value.length / 3000)), type: 'docx', exact: false };
  }
  throw new FolioError('Formato no compatible. Usa PDF, Word (.docx) o texto (.txt).');
}

  if (d === 0) return `<span class="chip due">Hoy</span>`;

  return `<span class="chip">En ${d} días</span>`;
}
function deadlinesHTML() {

  return `<ul class="deadlines">${next.map(p => { const d = daysUntil(p.fecha); const color = d < 0 || d === 0 ? 'var(--danger)' : d <= 3 ? 'var(--warn)' : 'var(--ink)';

}

      <details class="instr"><summary>Instrucciones fijas de Folio para el modelo (no contienen datos del caso)</summary><div class="payload">${highlightTokens(instr)}</div></details>
      <label class="row small" style="margin-top:.8rem"><input type="checkbox" id="rv-skip"> No volver a mostrar antes de cada envío (puedes reactivarlo en Ajustes)</label>` });
  if (!r) return false;
  if (r.skip) { S.settings.review = false; await saveSettings(); }
  return true;
}
function historyFor(e) {
  const h = e.chat.filter(m => m.role === 'user' || m.role === 'assistant').slice(-8).map(m => ({ role: m.role, content: m.content }));
  while (h.length && h[0].role !== 'user') h.shift();
  const out = []; for (const m of h) { if (out.length && out[out.length - 1].role === m.role) out[out.length - 1].content += '\n\n' + m.content; else out.push({ ...m }); }
  return out;
}
async function sendChat(text) {
  const e = S.exp, s = S.settings; text = text.trim(); if (!text || S.sending) return;
  const P = makePseudo(e, s.pseudo);
  const ctx = buildContext(e, S.docTexts, text);
  const system = P.apply(SYSTEM_PROMPT + '\n\n' + ctx.text);
  const hist = historyFor(e).map(m => ({ role: m.role, content: P.apply(m.content) }));
  let messages = [...hist, { role: 'user', content: P.apply(text) }];
  if (messages.length >= 2 && messages[messages.length - 2].role === 'user') { const last = messages.pop(); messages[messages.length - 1].content += '\n\n' + last.content; }
  if (!(await reviewPayload(system, messages, P, 'chat'))) return;
  e.chat.push({ role: 'user', content: text, at: new Date().toISOString() });
  S.sending = true; S.abort = new AbortController(); renderAgent();
  const box = $('#msgs'); box.insertAdjacentHTML('beforeend', `<div class="msg assistant" id="streaming"><span class="typing" aria-label="El agente está escribiendo"><i></i><i></i><i></i></span></div>`); scrollMsgs();
  const chars = system.length + messages.reduce((a, m) => a + m.content.length, 0);
  try {
    let pending = null;
    const full = await llm({ cfg: s, system, messages, stream: true, maxTokens: 6000, signal: S.abort.signal, onDelta: t => { pending = t; requestAnimationFrame(() => { if (pending == null) return; const el = $('#streaming'); if (el) { el.innerHTML = md(P.restore(pending)); scrollMsgs(); } pending = null; }); } });
    const content = P.restore(full).trim() || '(El modelo no devolvió texto.)';
    e.chat.push({ role: 'assistant', content, at: new Date().toISOString(), meta: { provider: s.provider, model: s.model, pseudo: P.enabled, replaced: P.count() } });
    await logSend('Consulta', chars, P);
  } catch (err) {
    if (err.name === 'AbortError') e.chat.push({ role: 'error', content: 'Detuviste la respuesta.' });
    else e.chat.push({ role: 'error', content: err instanceof FolioError ? err.message : 'Error inesperado: ' + err.message });
  } finally { S.sending = false; S.abort = null; await saveExp().catch(fail); renderAgent(); updateStamp(); $('#q')?.focus(); }
}
async function logSend(kind, chars, P) {
  const s = S.settings; S.lastSend = { at: Date.now(), provider: s.provider, pseudo: P.enabled };
  await addAudit({ at: new Date().toISOString(), kind, provider: s.provider, model: s.model, exp: S.exp?.numero || 's/n', chars, pseudo: P.enabled, replaced: P.count(), local: !PROVIDERS[s.provider]?.abroad });
}

/* ---------- La memoria se actualiza con tu aprobación ---------- */
async function proposeMemory() {
  const e = S.exp, s = S.settings; const P = makePseudo(e, s.pseudo);
  const convo = e.chat.filter(m => m.role !== 'error').slice(-8).map(m => `${m.role === 'user' ? 'ABOGADO' : 'AGENTE'}: ${m.content}`).join('\n\n');
  const system = `Eres el módulo de memoria de Folio. Propón cambios a la memoria de un expediente judicial peruano a partir de la conversación reciente. Devuelve SOLO un objeto JSON válido, sin texto adicional, con esta forma:
{"estado": string|null, "resumen_agregar": string|null, "hechos_agregar": string|null, "estrategia_agregar": string|null, "pendientes_nuevos": [string], "plazos_nuevos": [{"fecha": "AAAA-MM-DD", "descripcion": string}]}
Incluye solo información nueva que aparezca de forma explícita en la conversación. No inventes fechas: un plazo nuevo solo se propone si la conversación menciona una fecha concreta. Usa null o listas vacías si no hay nada. Conserva los marcadores como [PERSONA_1] tal cual.`;
  const user = P.apply(`FECHA DE HOY: ${todayISO()}\n\nMEMORIA ACTUAL:\n${memoryText(e)}\n\nCONVERSACIÓN RECIENTE:\n${convo}`);
  if (!(await reviewPayload(system, [{ role: 'user', content: user }], P, 'memoria'))) return;
  const btn = $('[data-action="propose-memory"]'); if (btn) { btn.disabled = true; btn.textContent = 'Analizando…'; }
  try {
    const out = await llm({ cfg: s, system, messages: [{ role: 'user', content: user }], maxTokens: 4000 });
    await logSend('Actualizar memoria', system.length + user.length, P);
    const j = parseJSONLoose(out); const R = v => typeof v === 'string' ? P.restore(v).trim() : '';
    const items = [];
    if (R(j.estado)) items.push({ k: 'estado', label: 'Nuevo estado procesal', v: R(j.estado) });
    if (R(j.resumen_agregar)) items.push({ k: 'resumen', label: 'Agregar al resumen', v: R(j.resumen_agregar) });
    if (R(j.hechos_agregar)) items.push({ k: 'hechos', label: 'Agregar a hechos clave', v: R(j.hechos_agregar) });
    if (R(j.estrategia_agregar)) items.push({ k: 'estrategia', label: 'Agregar a la estrategia', v: R(j.estrategia_agregar) });
    (j.pendientes_nuevos || []).map(R).filter(Boolean).forEach(v => items.push({ k: 'pend', label: 'Nuevo pendiente', v }));
    (j.plazos_nuevos || []).filter(p => p && /^\d{4}-\d{2}-\d{2}$/.test(p.fecha || '') && R(p.descripcion)).forEach(p => items.push({ k: 'plazo', label: `Nuevo plazo, ${fmtDate(p.fecha)}`, v: R(p.descripcion), fecha: p.fecha }));
    if (!items.length) { toast('El agente no encontró información nueva para la memoria.'); return; }
    const sel = await askDialog({ title: 'Cambios propuestos a la memoria', ok: 'Aplicar seleccionados', wide: true,
      collect: d => $$('[data-prop]', d).filter(c => c.checked).map(c => +c.dataset.prop),
      body: `<p>Marca lo que quieres guardar. Nada cambia sin tu aprobación.</p><ul class="proposal">${items.map((it, i) => `<li><label class="check"><input type="checkbox" data-prop="${i}" ${it.k === 'plazo' ? '' : 'checked'}><span><strong>${esc(it.label)}</strong><br>${esc(it.v)}${it.k === 'plazo' ? '<br><span class="small" style="color:var(--warn)">Verifica esta fecha con la resolución y tu notificación antes de aceptarla.</span>' : ''}</span></label></li>`).join('')}</ul>` });
    if (!sel || !sel.length) return;
    const m = e.memoria;
    for (const i of sel) { const it = items[i];
      if (it.k === 'estado') e.estado = it.v;
      else if (it.k === 'pend') m.pendientes.push({ id: uid(), text: it.v, done: false });
      else if (it.k === 'plazo') m.plazos.push({ id: uid(), fecha: it.fecha, desc: it.v, done: false });
      else m[it.k] = (m[it.k] ? m[it.k].trimEnd() + '\n' : '') + it.v; }
    await saveExp(); renderPane(); toast(`Memoria actualizada: ${sel.length} cambio${sel.length > 1 ? 's' : ''}.`);
  } catch (err) { fail(err); } finally { renderAgent(); updateStamp(); }
}

async function pasteCEJ() {
  const s = S.settings;
  const text = await askDialog({ title: 'Pegar seguimiento del CEJ', ok: isReady(s) ? 'Ordenar con el agente' : 'Entendido', wide: true,
    collect: d => { if (!isReady(s)) return ''; const v = $('#cej-text', d).value.trim(); if (!v) { $('#cej-err', d).textContent = 'Pega primero el texto copiado del CEJ.'; return null; } return v; },
    body: `<ol class="small"><li>Abre la consulta del expediente en cej.pj.gob.pe.</li><li>Selecciona el bloque de seguimiento del expediente y cópialo.</li><li>Pégalo aquí. El agente extrae fecha, acto y sumilla; tú revisas antes de guardar.</li></ol>
      ${isReady(s) ? `<label class="field"><span>Texto copiado</span><textarea class="textarea" id="cej-text" rows="10" placeholder="Pega aquí el seguimiento del expediente"></textarea></label><p id="cej-err" class="small" style="color:var(--danger)" role="alert"></p>` : '<div class="note warn"><p>Para ordenar el texto necesitas conectar un proveedor de IA. Mientras tanto, usa Agregar movimiento.</p></div>'}` });
  if (!text) return;
  const e = S.exp; const P = makePseudo(e, s.pseudo);
  const system = `Extrae los movimientos procesales del texto copiado de la Consulta de Expedientes Judiciales (CEJ) del Poder Judicial del Perú. Devuelve SOLO un objeto JSON válido, sin texto adicional: {"movimientos":[{"fecha":"AAAA-MM-DD"|null,"acto":"texto breve, por ejemplo 'Resolución 3' o 'Escrito'","sumilla":"resumen en una línea"}]}. Usa exactamente las fechas del texto. No inventes movimientos. Conserva los marcadores como [PERSONA_1] tal cual.`;
  const user = P.apply(text.slice(0, 20000));
  if (!(await reviewPayload(system, [{ role: 'user', content: user }], P, 'cej'))) return;
  toast('El agente está ordenando los movimientos…');
  try {
    const out = await llm({ cfg: s, system, messages: [{ role: 'user', content: user }], maxTokens: 8000 });
    await logSend('Ordenar movimientos', system.length + user.length, P); updateStamp();
    const list = (parseJSONLoose(out).movimientos || []).map(v => ({ fecha: /^\d{4}-\d{2}-\d{2}$/.test(v.fecha || '') ? v.fecha : '', acto: P.restore(String(v.acto || '')).trim(), sumilla: P.restore(String(v.sumilla || '')).trim() })).filter(v => v.acto);
    if (!list.length) { toast('No se encontraron movimientos en el texto.', true); return; }
    const sel = await askDialog({ title: `${list.length} movimientos encontrados`, ok: 'Agregar seleccionados', wide: true,
      collect: d => $$('[data-mv]', d).filter(c => c.checked).map(c => +c.dataset.mv),
      body: `<p>Revisa cada movimiento contra el CEJ antes de agregarlo.</p><ul class="proposal">${list.map((v, i) => `<li><label class="check"><input type="checkbox" data-mv="${i}" checked><span><span class="mono"><strong>${esc(fmtDate(v.fecha))}</strong></span> ${esc(v.acto)}<br><span class="small muted">${esc(v.sumilla)}</span></span></label></li>`).join('')}</ul>` });
    if (!sel || !sel.length) return;
    sel.forEach(i => e.movimientos.push({ id: uid(), ...list[i] }));
    await saveExp(); renderPane(); updateTabs(); toast(`${sel.length} movimientos agregados.`);
  } catch (err) { fail(err); }
}

    <section class="sheet"><div class="sheet-head"><h3>Registro de envíos</h3>${S.audit.length ? '<button class="btn sm" data-action="export-audit">Descargar CSV</button>' : ''}</div>
      <p class="hint">Cada vez que el agente envía información, queda anotado aquí, solo en este equipo. Te sirve para demostrar qué salió, cuándo y a quién.</p>
      ${S.audit.length ? `<div class="table-wrap"><table class="audit"><thead><tr><th>Fecha</th><th>Acción</th><th>Expediente</th><th>Destino</th><th>Datos reemplazados</th></tr></thead><tbody>${S.audit.slice(0, 50).map(a => `<tr><td class="mono">${esc(fmtDateTime(a.at))}</td><td>${esc(a.kind)}</td><td class="mono">${esc(a.exp)}</td><td>${esc(provLabel(a.provider))}<br><span class="muted">${esc(a.model)}</span></td><td>${a.pseudo ? a.replaced : 'Desactivado'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">Aún no hay envíos.</p>'}</section>
    <section class="sheet"><h3>Documentos legales</h3><p class="hint" id="consent-line"></p>
      <div class="row"><button class="btn" data-action="show-policy">Política de privacidad</button><button class="btn" data-action="show-terms">Términos de uso</button><button class="btn" data-action="show-clause">Autorización para clientes</button></div></section>
    <section class="sheet"><h3>Apariencia</h3><label class="field" style="max-width:280px"><span>Tema</span><select class="select" data-setting="theme">${[['auto', 'Según el sistema'], ['light', 'Claro'], ['dark', 'Oscuro']].map(([v, l]) => `<option value="${v}" ${s.theme === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></section>
    <section class="sheet"><h3>Qué no hace esta versión</h3><ul class="small"><li>No se conecta al CEJ ni al SINOE: pegas el seguimiento y el agente lo ordena.</li><li>No lee documentos escaneados como imagen.</li><li>No sincroniza entre equipos ni tiene app móvil.</li><li>No calcula plazos procesales: los registras tú.</li></ul><p class="tiny muted">Folio ${esc(APP.version)}</p></section>
    <section class="sheet" style="border-color:var(--danger)"><h3>Borrar todo</h3><p class="hint">Elimina de este navegador todos los expedientes, documentos, conversaciones, ajustes y el registro de envíos.</p><button class="btn danger" data-action="wipe-all">Borrar todos los datos de este equipo</button></section>
  </div></div>`;
}
async function fillConsentLine() {
  const c = await DB.get('consent'); const el = $('#consent-line');
  if (el && c) el.textContent = `Aceptaste los avisos de la versión ${c.policyVersion} el ${fmtDateTime(c.acceptedAt)}. La aceptación queda guardada en este equipo${c.history?.length ? ` junto con ${c.history.length === 1 ? 'la aceptación anterior' : `las ${c.history.length} aceptaciones anteriores`}` : ''}.`;
}
async function exportBackup() {
  const keys = await DB.keys(); const records = {};
  for (const k of keys) records[k] = await DB.get(k);
  download(new Blob([JSON.stringify({ format: 'folio-respaldo', version: 1, app: APP.version, exportedAt: new Date().toISOString(), records })], { type: 'application/json' }), `folio-respaldo-${todayISO()}.folio`);
  toast('Copia descargada. Está cifrada con tu contraseña actual.');
}
async function importBackup(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { return toast('El archivo no es una copia de Folio válida.', true); }
  if (data.format !== 'folio-respaldo' || !data.records?.vault) return toast('El archivo no es una copia de Folio válida.', true);
  const ok = await askDialog({ title: 'Restaurar copia de seguridad', ok: 'Reemplazar y restaurar', danger: true, body: `<p>La copia es del ${esc(fmtDateTime(data.exportedAt))}. Reemplazará <strong>todos</strong> los datos actuales de este equipo.</p><p>Después se pedirá la contraseña con la que se hizo esa copia.</p>` });
  if (!ok) return;
  await DB.clear(); await DB.putMany(Object.entries(data.records));
  lockNow('Copia restaurada. Ingresa la contraseña de esa copia.');
}
async function wipeAll() {
  const ok = await askDialog({ title: 'Borrar todos los datos', ok: 'Borrar todo', danger: true,
    collect: d => $('#wipe-ok', d).checked ? true : ($('#wipe-err', d).textContent = 'Marca la casilla para confirmar.', null),
    body: `<p>Se borrarán de este navegador todos los expedientes, documentos, conversaciones, ajustes, tu API key y el registro de envíos. No se puede deshacer.</p><label class="check"><input type="checkbox" id="wipe-ok"><span>Entiendo que el borrado es definitivo.</span></label><p id="wipe-err" class="small" style="color:var(--danger)" role="alert"></p>` });
  if (!ok) return;
  await DB.clear(); Vault.lock(); location.reload();
}
async function changePassFlow() {
  const r = await askDialog({ title: 'Cambiar contraseña', ok: 'Cambiar contraseña',
    collect: d => { const c = $('#cp-c', d).value, n = $('#cp-n', d).value, n2 = $('#cp-n2', d).value; const er = $('#cp-err', d);
      if (n.length < 10) { er.textContent = 'La nueva contraseña debe tener al menos 10 caracteres.'; return null; }
      if (n !== n2) { er.textContent = 'Las contraseñas nuevas no coinciden.'; return null; } return { c, n }; },
    body: `<label class="field"><span>Contraseña actual</span><input class="input" type="password" id="cp-c" autocomplete="current-password"></label><label class="field"><span>Nueva contraseña</span><input class="input" type="password" id="cp-n" autocomplete="new-password"></label><label class="field"><span>Repite la nueva contraseña</span><input class="input" type="password" id="cp-n2" autocomplete="new-password"></label><p class="small muted">Las copias de seguridad anteriores seguirán usando la contraseña antigua.</p><p id="cp-err" class="small" style="color:var(--danger)" role="alert"></p>` });
  if (!r) return;
  toast('Cifrando de nuevo tus datos…');
  try { await Vault.changePass(r.c, r.n); toast('Contraseña cambiada.'); } catch (e) { fail(e); }
}
function exportAudit() {
  const rows = [['fecha', 'accion', 'expediente', 'proveedor', 'modelo', 'caracteres', 'reemplazo_activo', 'datos_reemplazados', 'procesamiento_local']]
    .concat(S.audit.map(a => [a.at, a.kind, a.exp, provLabel(a.provider), a.model, a.chars, a.pseudo ? 'si' : 'no', a.replaced, a.local ? 'si' : 'no']));
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), `folio-registro-envios-${todayISO()}.csv`);
}

/* ============================================================
   Eventos (delegados)
   ============================================================ */
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; }
document.addEventListener('click', async ev => {
  const db = ev.target.closest('[data-dlg]'); if (db) { onDlgButton(db); return; }
  const a = ev.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action, id = a.dataset.id;
  if (a.tagName === 'A') ev.preventDefault();
  try {
    switch (act) {
      case 'dlg-close': closeDialog(); break;
      case 'show-policy': showLegal('policy'); break;
      case 'show-terms': showLegal('terms'); break;
      case 'show-clause': showLegal('clause'); break;
      case 'clause-copy': await navigator.clipboard.writeText(clauseText()); toast('Texto copiado.'); break;
      case 'clause-download': download(new Blob([clauseText()], { type: 'text/plain;charset=utf-8' }), 'autorizacion-uso-ia-cliente.txt'); break;
      case 'onb-next': if (onbCanNext()) { S.onb.step++; renderOnb(); } break;
      case 'onb-back': S.onb.step--; renderOnb(); break;
      case 'onb-finish': await finishOnb(!!a.dataset.skip); break;
      case 'toggle-key': { const i = $('#pf-key'); if (i) { i.type = i.type === 'password' ? 'text' : 'password'; a.textContent = i.type === 'password' ? 'Mostrar' : 'Ocultar'; } break; }
      case 'list-models': await fillModels(); break;
      case 'show-keyguide': showKeyGuide(); break;
      case 'pick-model': { const cfg = curCfg(); cfg.model = a.dataset.model; const inp = $('#pf-model'); if (inp) inp.value = cfg.model; $$('.preset').forEach(b => b.classList.toggle('on', b.dataset.model === cfg.model)); break; }
      case 'test-conn': await testConn(); break;
      case 'wipe-from-lock': await wipeAll(); break;
      case 'open-side': S.sideOpen = true; $('.app')?.classList.add('side-open'); break;
      case 'close-side': S.sideOpen = false; $('.app')?.classList.remove('side-open'); break;
      case 'open-exp': await openExp(id); break;
      case 'new-exp': await expForm(null); break;
      case 'edit-exp': await expForm(S.exp); break;
      case 'del-exp': await deleteExp(); break;
      case 'load-sample': await loadSample(); break;
      case 'tab': S.tab = a.dataset.tab; $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab)); $('#work')?.classList.toggle('show-agent', S.tab === 'agente'); renderPane(); if (S.tab === 'agente') scrollMsgs(); break;
      case 'add-plazo': { const f = $('#nplazo-f').value, d = $('#nplazo-d').value.trim(); if (!f || !d) { toast('Indica la fecha y qué vence.', true); break; } S.exp.memoria.plazos.push({ id: uid(), fecha: f, desc: d, done: false }); await saveExp(); renderPane(); break; }
      case 'toggle-plazo': { const p = S.exp.memoria.plazos.find(x => x.id === id); p.done = !p.done; await saveExp(); renderPane(); break; }
      case 'del-plazo': S.exp.memoria.plazos = S.exp.memoria.plazos.filter(x => x.id !== id); await saveExp(); renderPane(); break;
      case 'add-pend': { const v = $('#npend').value.trim(); if (!v) break; S.exp.memoria.pendientes.push({ id: uid(), text: v, done: false }); await saveExp(); renderPane(); $('#npend')?.focus(); break; }
      case 'toggle-pend': { const p = S.exp.memoria.pendientes.find(x => x.id === id); p.done = !p.done; await saveExp(); renderPane(); break; }
      case 'del-pend': S.exp.memoria.pendientes = S.exp.memoria.pendientes.filter(x => x.id !== id); await saveExp(); renderPane(); break;
      case 'add-parte': { const n = $('#nparte-n').value.trim(); if (n.split(/\s+/).length < 2) { toast('Escribe nombres y apellidos completos para reemplazarlos bien.', true); break; } addParte(S.exp, n, $('#nparte-r').value, $('#nparte-d').value, $('#nparte-c').checked); await saveExp(); render(); break; }
      case 'toggle-cliente': { const p = S.exp.partes.find(x => x.id === id); p.esCliente = !p.esCliente; await saveExp(); render(); break; }
      case 'del-parte': { const ok = await askDialog({ title: 'Quitar parte', ok: 'Quitar', danger: true, body: '<p>Si la quitas, su nombre ya no se reemplazará antes de enviar al proveedor.</p>' }); if (!ok) break; S.exp.partes = S.exp.partes.filter(x => x.id !== id); await saveExp(); render(); break; }
      case 'add-mov': await movForm(); break;
      case 'paste-cej': await pasteCEJ(); break;
      case 'del-mov': S.exp.movimientos = S.exp.movimientos.filter(x => x.id !== id); await saveExp(); renderPane(); updateTabs(); break;
      case 'pick-file': $('#file-docs').click(); break;
      case 'view-doc': { const d = S.exp.docs.find(x => x.id === id); const t = S.docTexts[id] || ''; openDialog({ title: d.name, wide: true, body: `<p class="small muted">Texto extraído en tu equipo${t.length > 40000 ? ', primeros 40 000 caracteres' : ''}.</p><div class="payload">${esc(t.slice(0, 40000)) || 'Sin texto.'}</div>`, foot: '<button class="btn primary" data-action="dlg-close">Cerrar</button>' }); break; }
      case 'del-doc': { const d = S.exp.docs.find(x => x.id === id); const ok = await askDialog({ title: 'Eliminar documento', ok: 'Eliminar', danger: true, body: `<p>Se eliminará el texto de <strong>${esc(d.name)}</strong> de este equipo.</p>` }); if (!ok) break; await store.del('doc:' + id); delete S.docTexts[id]; S.exp.docs = S.exp.docs.filter(x => x.id !== id); await saveExp(); renderPane(); updateTabs(); break; }
      case 'quick': { const q = QUICK[+a.dataset.i][1]; if (+a.dataset.i === 3) { const t = $('#q'); t.value = q; t.focus(); t.setSelectionRange(q.length, q.length); } else await sendChat(q); break; }
      case 'stop': S.abort?.abort(); break;
      case 'copy-msg': await navigator.clipboard.writeText(S.exp.chat[+a.dataset.i].content); toast('Respuesta copiada.'); break;
      case 'clear-chat': { const ok = await askDialog({ title: 'Limpiar conversación', ok: 'Limpiar', body: '<p>Se borra la conversación de este expediente. La memoria del caso se mantiene.</p>' }); if (!ok) break; S.exp.chat = []; await saveExp(); renderAgent(); break; }
      case 'propose-memory': await proposeMemory(); break;
      case 'open-settings': await settingsView(); fillConsentLine(); break;
      case 'close-settings': S.view = 'exp'; render(); break;
      case 'save-provider': Object.assign(S.settings, pickCfg(S.draftCfg)); await saveSettings(); toast(isReady(S.settings) ? 'Proveedor guardado.' : 'Guardado. Falta la key o el modelo para usar el agente.', !isReady(S.settings)); break;
      case 'lock-now': lockNow(); break;
      case 'reconsent-accept': await acceptReconsent(); break;
      case 'reconsent-decline': lockNow('Folio quedó bloqueado. Para usarlo debes aceptar los avisos vigentes.'); break;
      case 'change-pass': await changePassFlow(); break;
      case 'export-backup': await exportBackup(); break;
      case 'import-backup': $('#file-backup').click(); break;
      case 'export-audit': exportAudit(); break;
      case 'wipe-all': await wipeAll(); break;
    }
  } catch (e) { fail(e); }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  try {
    if (t.dataset.onbCheck !== undefined) { S.onb.checks[t.dataset.onbCheck] = t.checked; updateOnbNav(); }
    else if (t.hasAttribute('data-reconsent-check')) { const b = $('[data-action="reconsent-accept"]'); if (b) b.disabled = !t.checked; }
    else if (t.hasAttribute('data-onb-pseudo')) S.onb.pseudo = t.checked;
    else if (t.dataset.pf) {
      const cfg = curCfg(); const k = t.dataset.pf;
      cfg[k] = t.type === 'checkbox' ? t.checked : t.value;
      if (k === 'provider') { cfg.baseUrl = ''; cfg.model = ''; $('#pf-block').innerHTML = providerFieldsHTML(cfg); }
    }
    else if (t.dataset.bind && S.exp) { setPath(S.exp, t.dataset.bind, t.value); saveSoon(); }
    else if (t.dataset.setting) {
      const k = t.dataset.setting; S.settings[k] = t.type === 'checkbox' ? t.checked : (k === 'autoLockMin' ? +t.value : t.value);
      await saveSettings(); if (k === 'theme') applyTheme(); toast('Ajuste guardado.');
    }
    else if (t.id === 'file-docs') { const f = [...t.files]; t.value = ''; await addFiles(f); }
    else if (t.id === 'file-backup') { const f = t.files[0]; t.value = ''; if (f) await importBackup(f); }
  } catch (e) { fail(e); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.onbField) { S.onb[t.dataset.onbField] = t.value; updateOnbNav(); }
  else if (t.dataset.pf && t.type !== 'checkbox' && t.tagName !== 'SELECT') curCfg()[t.dataset.pf] = t.value;
  else if (t.hasAttribute('data-search')) { S.filter = t.value; const l = $('#explist'); if (l) l.innerHTML = listHTML(); }
  else if (t.dataset.bind && S.exp) { setPath(S.exp, t.dataset.bind, t.value); saveSoon(); }
});
document.addEventListener('submit', async ev => {
  const f = ev.target.closest('[data-form]'); if (!f) return; ev.preventDefault();
  if (f.dataset.form === 'unlock') await doUnlock(f.pass.value);
  if (f.dataset.form === 'chat') { const v = $('#q').value; if (!v.trim()) return; await sendChat(v); }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t.id === 'q' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); t.closest('form')?.requestSubmit(); }
  if (t.classList?.contains('dropzone') && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); $('#file-docs').click(); }
  if (ev.key === 'Enter' && (t.id === 'npend' || t.id === 'nplazo-d' || t.id === 'nparte-n' || t.id === 'nparte-d')) { ev.preventDefault(); $(`[data-action="${t.id === 'npend' ? 'add-pend' : t.id === 'nplazo-d' ? 'add-plazo' : 'add-parte'}"]`)?.click(); }
});
document.addEventListener('dragover', ev => { const z = ev.target.closest?.('.dropzone'); if (z) { ev.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const z = ev.target.closest?.('.dropzone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest?.('.dropzone'); if (!z) return; ev.preventDefault(); z.classList.remove('over'); addFiles([...ev.dataTransfer.files]).catch(fail); });
window.addEventListener('beforeunload', () => { if (S.exp && Vault.key) saveExp(); });

/* ============================================================
   Inicio
   ============================================================ */
$('#dlg').addEventListener('cancel', () => settleDlg(false));
(async function boot() {
  render();
  if (!window.crypto?.subtle || !window.indexedDB) { S.screen = 'error'; S.bootError = 'Este navegador no permite el almacenamiento cifrado local que Folio necesita. Abre el archivo con Chrome, Edge o Firefox actualizados.'; return render(); }
  try { await DB.open(); } catch { S.screen = 'error'; S.bootError = 'El navegador bloqueó el almacenamiento local. Si estás en modo incógnito, abre Folio en una ventana normal.'; return render(); }
  const meta = await DB.get('vault');
  if (meta) { S.screen = 'lock'; S.stampPress = true; } else { S.screen = 'onb'; S.onb = newOnb(); }
  render();
})();

</script>
</body>
</html>
